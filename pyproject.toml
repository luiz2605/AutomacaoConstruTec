[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orcauto"
version = "1.0.0"
description = "Cruza um orçamento analítico em PDF com as composições de custo de uma planilha Excel e gera versões automatizadas das abas de levantamento."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "pdfplumber>=0.11"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
orcauto = "orcauto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["orcauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::UserWarning"]
