services:
  - type: web
    name: orcauto-web
    runtime: python
    plan: free            # 512 MB — o pico medido é ~180 MB
    # `pip install -e .` é obrigatório: o pacote mora em `src/orcauto/`, e sem
    # instalá-lo o `from orcauto import Config` de webapp/service.py não
    # resolve. Só o requirements.txt não basta.
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn webapp.app:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    healthCheckPath: /saude       # rota sem autenticação, de propósito
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ORCAUTO_MAX_MB
        value: "40"
      - key: ORCAUTO_USUARIO
        value: orcamentos
      - key: ORCAUTO_SENHA
        sync: false       # digitada no painel do Render; nunca no repositório

    # NÃO declarar aqui as variáveis do relato por e-mail (ORCAUTO_SMTP_HOST,
    # ORCAUTO_SMTP_PORTA, ORCAUTO_SMTP_USUARIO, ORCAUTO_SMTP_SENHA,
    # ORCAUTO_EMAIL_SUPORTE). Elas são cadastradas direto no painel do Render,
    # em Environment. Declará-las com `sync: false` acrescentou quatro variáveis
    # sem valor a um blueprint que já existia, e o deploy de blueprint falhou
    # (08/09/2026, 4:20:59) — enquanto o Auto-Deploy do MESMO commit subiu sem
    # problema, o que mostra que o defeito era deste arquivo, não do código.
    # Nada se perde: as cinco são opcionais. Sem elas a aplicação sobe igual,
    # o link "Relatar um problema" não aparece e /relatar responde 503.
    # A tabela com o que cada uma faz está no README.
