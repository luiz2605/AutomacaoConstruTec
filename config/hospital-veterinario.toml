# Hospital Veterinário Unicatólica Quixadá.
# Ajustado após a auditoria de 17/08/2026 (ver AUDITORIA.md).

[compositions]
# A autodetecção também acha "COMP.027", uma aba antiga com códigos repetidos.
# Fixar as duas abas corretas evita depender da ordem de precedência.
sheets = ["COMPOSIÇÃO TAB 28", "COMPOSIÇÃO PROPRIAS"]

# --- sub-serviço vira coluna (relatório de erros v3) ----------------------
# Com `true` (padrão histórico) o resolvedor abre todo sub-serviço e só o
# insumo-folha vira coluna. Isso somava a mão de obra de dentro da argamassa
# à mão de obra da alvenaria (C3347: SERVENTE 10,0 em vez de 7,0; C4592:
# 12,2 em vez de 9,2; C4301: CARPINTEIRO 1,10 em vez de 0,25) e fazia sumir a
# coluna da própria argamassa. Com `false`, o sub-serviço com composição
# própria vira uma coluna com o coeficiente de primeiro nível — que é como a
# planilha feita à mão faz (a aba INFRAESTRUTURA original tem uma coluna
# rotulada C3129, que hoje nunca receberia valor).
expand_subservices = false

[targets]
# Tópicos 3, 5 e 14 casam sozinhos com INFRAESTRUTURA, PAREDES e REVESTIMENTOS.

[rules]
quantity_policy = "preservar"

# --- PAREDES, linha 12 (C3614) -------------------------------------------
# Por semelhança (0,98), a linha legada C3614 seria assumida pelo item 5.2
# (C3615) do orçamento. O Luiz apontou que os 38,96 m2 de C3614 são medição
# real que não pode ser perdida. Com o bloqueio, C3614 permanece na linha 12 e
# C3615 entra na linha 14, com o intervalo do TOTAL ampliado automaticamente.
# CONSEQUÊNCIA: as duas linhas somam no mesmo TOTAL. A seção 5 do LOG AUTO
# sinaliza a linha 12 como "código não consta no orçamento" — decida qual
# manter antes de usar o TOTAL de tijolo maciço aparente.
# Para voltar ao comportamento anterior, remova o bloco abaixo.
[rules.substitution_block]
PAREDES = ["C3614"]

# --- REVESTIMENTOS, linha 10 (C0776) -------------------------------------
# A quantidade da aba (5.444,67 m2) era "parede + teto" com a composição de
# parede aplicada às duas áreas. O orçamento separa em 14.1 parede (4.264,14,
# C0776) e 14.2 teto (1.161,10, C0778), que têm composições diferentes.
# Mantida a quantidade original, o teto seria contado duas vezes.
[rules.quantity_override]
REVESTIMENTOS = { 10 = "orcamento" }
