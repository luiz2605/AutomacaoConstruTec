# Arquivo-base sem nenhuma aba de levantamento pronta — só o `MODELO BASE`.
# Toda aba é sintetizada a partir do molde, uma por tópico do orçamento.
#
#   orcauto run --config config/planilha-base.toml \
#       --xlsx "03_25.06.26__PLANILHA_BASE.xlsx" \
#       --pdf  OrcamentoAnaliticoProposta.pdf \
#       --out  "LEVANTAMENTO (AUTO).xlsx"

[compositions]
sheets = ["COMPOSIÇÃO TAB 28", "COMPOSIÇÃO PROPRIAS"]

# Sem filtro, o tópico INFRAESTRUTURA gera 36 colunas — 17 delas de mão de obra
# e equipamento, numa aba chamada "RELAÇÃO DE MATERIAIS". Descomente para
# levantar só material:
# column_sections = ["MATERIAIS"]

# --- sub-serviço vira coluna (relatório de erros v3) ----------------------
# Com `true` (padrão histórico) o resolvedor abre todo sub-serviço e só o
# insumo-folha vira coluna. Isso somava a mão de obra de dentro da argamassa
# à mão de obra da alvenaria (C3347: SERVENTE 10,0 em vez de 7,0; C4592:
# 12,2 em vez de 9,2; C4301: CARPINTEIRO 1,10 em vez de 0,25) e fazia sumir a
# coluna da própria argamassa. Com `false`, o sub-serviço com composição
# própria vira uma coluna com o coeficiente de primeiro nível — que é como a
# planilha feita à mão faz (a aba INFRAESTRUTURA original tem uma coluna
# rotulada C3129, que hoje nunca receberia valor).
expand_subservices = false

[targets]
template_sheet = "MODELO BASE"
